version: '3.8'

services:
  # 1. Streamlit Interactive Dashboard
  screening-web:
    build: .
    container_name: dr_screening_dashboard
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    restart: unless-stopped

  # 2. Production REST API (Optional Microservice)
  screening-api:
    build: .
    container_name: dr_screening_api
    command: ["python", "api.py"]
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped
